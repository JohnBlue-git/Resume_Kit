<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yujen Lan — Interview Deck</title>
<style>
:root { --navy:#0F2440; --teal:#00B8A9; --ice:#CFE3F2; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:#0a1422; overflow:hidden; font-family: Calibri, Carlito, 'Segoe UI', Arial, sans-serif; }
#viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#stage { position:relative; width:1280px; height:720px; transform-origin:center center; flex:none; }
.slide { position:absolute; inset:0; overflow:hidden; display:none; box-shadow:0 10px 40px rgba(0,0,0,.45); }
.slide.active { display:block; }
.el { position:absolute; margin:0; }
.tx { position:absolute; inset:0; display:flex; flex-direction:column; overflow:visible; }
.tx p, td p { margin:0; overflow-wrap:break-word; }
.pic { background-size:100% 100%; background-repeat:no-repeat; }
.pic.zoom { cursor:zoom-in; outline:0 solid var(--teal); transition:outline-width .15s; }
.pic.zoom:hover { outline-width:3px; }
table.tbl { border-collapse:collapse; table-layout:fixed; }
table.tbl td { overflow-wrap:break-word; }
.chart { display:flex; flex-direction:column; font-family: Calibri, Carlito, sans-serif; }
.chart .ct { text-align:center; font-size:14.7px; color:#0F2440; padding:6px 0 10px; }
.chart .crs { flex:1; display:flex; flex-direction:column; justify-content:space-around; padding:0 8px 8px 0; }
.chart .cr { display:flex; align-items:center; gap:10px; font-size:13.3px; color:#5C6B7A; }
.chart .cl { width:70px; text-align:right; }
.chart .cb { flex:1; display:flex; align-items:center; gap:6px; padding-right:34px; }
.chart .cb i { display:block; height:28px; animation:grow .9s ease-out both; }
.chart .cb b { font-weight:400; color:#16232F; }
.slide:not(.active) .chart .cb i { animation:none; }
@keyframes grow { from { max-width:0; } to { max-width:100%; } }
/* step-by-step builds */
[data-f] { opacity:0; translate:0 10px; transition:opacity .35s ease, translate .35s ease; }
[data-f].on { opacity:1; translate:0 0; }
tr[data-f] { translate:none; }
body.allon [data-f] { opacity:1; translate:0 0; transition:none; }
.slide.hasnext::after { content:""; position:absolute; right:14px; bottom:46px; width:9px; height:9px; border-radius:50%; background:var(--teal); opacity:.75; animation:pulse 1.6s infinite; }
body.allon .slide.hasnext::after { display:none; }
@keyframes pulse { 50% { opacity:.2; } }
/* links */
a.go { color:inherit; text-decoration:underline; text-decoration-color:rgba(0,137,126,.55); text-underline-offset:2px; cursor:pointer; }
a.go:hover { color:#00897E; }
.chip-link { cursor:pointer; }
.chip-link:hover { color:#fff !important; text-decoration:underline; }
/* UI */
#bar { position:fixed; left:50%; bottom:14px; translate:-50% 0; display:flex; gap:6px; align-items:center; background:rgba(15,36,64,.92);
  border:1px solid #24476B; border-radius:999px; padding:6px 10px; color:var(--ice); font-size:14px; z-index:20; transition:opacity .3s; }
body.idle #bar { opacity:0; }
#bar button { background:none; border:0; color:var(--ice); font:inherit; padding:5px 10px; border-radius:999px; cursor:pointer; }
#bar button:hover, #bar button.on { background:#16324F; color:#fff; }
#count { min-width:84px; text-align:center; font-variant-numeric:tabular-nums; }
#progress { position:fixed; left:0; top:0; height:3px; background:var(--teal); z-index:20; transition:width .25s; }
.overlay { position:fixed; inset:0; background:rgba(5,12,22,.96); z-index:30; display:none; }
.overlay.open { display:block; }
#toc .inner { position:absolute; inset:5% 8%; overflow:auto; color:var(--ice); columns:3 300px; column-gap:36px; }
#toc h3 { break-after:avoid; margin:18px 0 6px; font:700 13px Calibri, Carlito, sans-serif; letter-spacing:2px; color:var(--teal); text-transform:uppercase; }
#toc a { display:block; break-inside:avoid; padding:4px 8px; border-radius:6px; color:var(--ice); text-decoration:none; font-size:15px; cursor:pointer; }
#toc a:hover, #toc a.cur { background:#16324F; color:#fff; }
#toc a span { color:#7FA3C2; display:inline-block; width:34px; font-variant-numeric:tabular-nums; }
#toc .hint { column-span:all; color:#7FA3C2; font-size:13px; }
#notes { position:fixed; top:0; right:0; bottom:0; width:min(420px, 40vw); background:#0F2440; color:var(--ice); z-index:25; padding:22px 22px 80px;
  overflow:auto; translate:100% 0; transition:translate .25s; border-left:1px solid #24476B; font-size:15px; line-height:1.55; white-space:pre-wrap; }
#notes.open { translate:0 0; }
#notes h4 { margin:0 0 10px; color:var(--teal); font-size:12px; letter-spacing:2px; }
#lightbox { cursor:zoom-out; }
#lightbox div { position:absolute; inset:3%; background-size:contain; background-repeat:no-repeat; background-position:center; }
#goto { position:fixed; left:50%; top:40%; translate:-50% 0; background:#0F2440; color:#fff; font-size:40px; padding:10px 26px; border-radius:12px; border:1px solid var(--teal); display:none; z-index:40; }
@media print {
  @page { size:13.333in 7.5in; margin:0; }
  html, body { overflow:visible; height:auto; background:#fff; }
  #viewport { position:static; display:block; }
  #stage { transform:none !important; width:auto; height:auto; }
  .slide { display:block !important; position:relative; width:1280px; height:720px; box-shadow:none; break-after:page; }
  [data-f] { opacity:1 !important; translate:none !important; }
  #bar, #progress, .overlay, #notes, #goto, .slide::after { display:none !important; }
}
/*IMAGES*/
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage">
<!--SLIDES-->
</div></div>
<div id="bar">
  <button id="bPrev" title="Previous (←)">◀</button>
  <span id="count"></span>
  <button id="bNext" title="Next (→ / Space)">▶</button>
  <button id="bToc" title="Contents (T)">☰ Contents</button>
  <button id="bNotes" title="Speaker notes (N)">Notes</button>
  <button id="bBuild" title="Step-by-step builds on/off (B)">Builds</button>
  <button id="bFull" title="Full screen (F)">⛶</button>
</div>
<div id="toc" class="overlay"><div class="inner"></div></div>
<aside id="notes"><h4>SPEAKER NOTES</h4><div id="notesBody"></div></aside>
<div id="lightbox" class="overlay"><div></div></div>
<div id="goto"></div>
<script>
const META = /*META*/[];
const slides = [...document.querySelectorAll(".slide")];
const stage = document.getElementById("stage");
let cur = 0, step = 0;

function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720) * 0.98;
  stage.style.transform = `scale(${s})`;
}
addEventListener("resize", fit); fit();

function frags(i) { return [...new Set([...slides[i].querySelectorAll("[data-f]")].map(e => +e.dataset.f))].sort((a, b) => a - b); }
const FR = slides.map((_, i) => frags(i));

function paint() {
  slides.forEach((s, i) => s.classList.toggle("active", i === cur));
  const s = slides[cur];
  s.querySelectorAll("[data-f]").forEach(e => e.classList.toggle("on", +e.dataset.f <= step));
  s.classList.toggle("hasnext", step < (FR[cur].at(-1) || 0));
  document.getElementById("count").textContent = cur === 0 ? `title / ${slides.length - 1}` : `p.${cur} / ${slides.length - 1}`;
  document.getElementById("progress").style.width = (cur / (slides.length - 1) * 100) + "%";
  document.getElementById("notesBody").textContent = META[cur].notes || "(no notes for this slide)";
  history.replaceState(null, "", "#" + cur);
  document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("cur", +a.dataset.go === cur));
}
function go(i, atEnd) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  step = atEnd ? (FR[cur].at(-1) || 0) : 0;
  paint();
}
function next() {
  const nxt = FR[cur].find(f => f > step);
  if (nxt !== undefined && !document.body.classList.contains("allon")) { step = nxt; paint(); }
  else if (cur < slides.length - 1) go(cur + 1);
}
function prev() {
  const prv = [...FR[cur]].reverse().find(f => f < step);
  if (step > 0 && !document.body.classList.contains("allon")) { step = prv === undefined ? 0 : prv; paint(); }
  else if (cur > 0) go(cur - 1, true);
}

// ---- links: "p.N" references and cover chips
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if (a) { e.stopPropagation(); closeAll(); go(+a.dataset.go); return; }
  const z = e.target.closest(".pic.zoom");
  if (z) { const lb = document.getElementById("lightbox"); lb.firstElementChild.className = [...z.classList].find(c => c.startsWith("im-")); lb.classList.add("open"); }
});
slides.forEach((s, i) => {
  if (!s.dataset.cover) return;
  const chips = [...s.querySelectorAll(".el.tb")].filter(e => { const t = parseFloat(e.style.top); return t > 470 && t < 600 && parseFloat(e.style.height) < 50; })
    .sort((a, b) => (parseFloat(a.style.top) - parseFloat(b.style.top)) || (parseFloat(a.style.left) - parseFloat(b.style.left)));
  chips.forEach((c, k) => { c.dataset.go = i + 1 + k; c.classList.add("chip-link"); c.title = "Jump to p." + (i + 1 + k); });
});

// ---- table of contents (sections start at the appendix divider and at each project cover)
(function buildToc() {
  const inner = document.querySelector("#toc .inner");
  let html = '<div class="hint">Click to jump · type a page number + Enter anywhere · T toggles this list</div><h3>Main deck</h3>';
  META.forEach((m, i) => {
    if (m.cover) html += `<h3>${m.title}</h3>`;
    else if (i > 0 && m.title.startsWith("Project Deep Dives")) html += "<h3>Appendix</h3>";
    const label = i === 0 ? "Title" : m.title;
    html += `<a data-go="${i}"><span>${i === 0 ? "" : "p." + i}</span>${label}</a>`;
  });
  inner.innerHTML = html;
})();

function closeAll() { document.querySelectorAll(".overlay").forEach(o => o.classList.remove("open")); }
function toggle(id) { const o = document.getElementById(id); const was = o.classList.contains("open"); closeAll(); if (!was) o.classList.add("open"); }
document.getElementById("bPrev").onclick = prev;
document.getElementById("bNext").onclick = next;
document.getElementById("bToc").onclick = () => toggle("toc");
document.getElementById("bNotes").onclick = () => { document.getElementById("notes").classList.toggle("open"); document.getElementById("bNotes").classList.toggle("on"); };
document.getElementById("bBuild").onclick = () => { document.body.classList.toggle("allon"); document.getElementById("bBuild").classList.toggle("on", !document.body.classList.contains("allon")); paint(); };
document.getElementById("bBuild").classList.add("on");
document.getElementById("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.getElementById("lightbox").onclick = closeAll;
document.getElementById("toc").onclick = e => { if (e.target.id === "toc") closeAll(); };

let buf = "", bufT;
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, g = document.getElementById("goto");
  if (/^[0-9]$/.test(k)) { buf += k; g.textContent = "p." + buf; g.style.display = "block"; clearTimeout(bufT); bufT = setTimeout(() => { buf = ""; g.style.display = "none"; }, 2500); return; }
  if (k === "Enter" && buf) { go(+buf); buf = ""; g.style.display = "none"; return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
  else if (k === "Home") go(0);
  else if (k === "End") go(slides.length - 1);
  else if (k === "t" || k === "T") toggle("toc");
  else if (k === "n" || k === "N") document.getElementById("bNotes").click();
  else if (k === "b" || k === "B") document.getElementById("bBuild").click();
  else if (k === "f" || k === "F") document.getElementById("bFull").click();
  else if (k === "Escape") { closeAll(); document.getElementById("notes").classList.remove("open"); }
});
let tx = null;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) (d < 0 ? next : prev)(); tx = null; });
let idleT; addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2500); });

go(parseInt(location.hash.slice(1)) || 0);
</script>
</body>
</html>
